
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Supplement | PULSE FITNESS</title>
</head>
<body>

    <h1>Delete Supplement</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ supplement.name }}</strong>?
    </p>

    <p>This action cannot be undone.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Supplement</button>
    </form>

    <p>
        <a href="{% url 'supplement_list' %}">Cancel</a>
    </p>

</body>
</html>
