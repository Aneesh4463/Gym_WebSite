
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Supplement | PULSE FITNESS</title>
</head>
<body>

    <h1>Add New Supplement</h1>

    <p>Add a supplement to your gym store.</p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Supplement</button>
    </form>

    <p>
        <a href="{% url 'supplement_list' %}">Back to Supplement List</a>
    </p>

    <p>
        <a href="{% url 'owner_dashboard' %}">Back to Dashboard</a>
    </p>

</body>
</html>
