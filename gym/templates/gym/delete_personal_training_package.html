<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Package | PULSE FITNESS</title>
</head>
<body>

    <h1>Delete Personal Training Package</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ package.package_name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete Package</button>

        <a href="{% url 'personal_training_package_list' %}">
            Cancel
        </a>
    </form>

</body>
</html>
