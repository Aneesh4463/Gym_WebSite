
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Training Program | PULSE FITNESS</title>
</head>
<body>
    <h1>PULSE FITNESS</h1>
    <h2>Delete Training Program</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ program.program_name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Program</button>
    </form>

    <a href="{% url 'training_program_list' %}">
        Cancel
    </a>
</body>
</html>
