
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Equipment | PULSE FITNESS</title>
</head>
<body>
    <h1>PULSE FITNESS</h1>
    <h2>Delete Equipment</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ equipment.name }}</strong>?
    </p>

    {% if equipment.image %}
        <img
            src="{{ equipment.image.url }}"
            alt="{{ equipment.name }}"
            width="150"
        >
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Equipment</button>
    </form>

    <p>
        <a href="{% url 'equipment_list' %}">
            Cancel
        </a>
    </p>
</body>
</html>
